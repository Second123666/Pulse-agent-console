# 前端容器的 nginx 配置（挂到 /etc/nginx/conf.d/default.conf）
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 图片会以 base64 data URL 塞进 JSON body（前端多模态上传），
    # 后端 express.json 的 limit 是 10mb —— nginx 默认只有 1mb，不放开会 413
    client_max_body_size 16m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 反代到后端容器。^~ 是为了让这个前缀优先于下面的静态资源正则 ——
    # 否则 /api/xxx.png 这种路径会被当成静态文件从磁盘找。
    #
    # proxy_pass 末尾的斜杠 = 剥掉 /api 前缀，与 vite dev 代理的
    # rewrite: path => path.replace('/api/', '/') 行为一致
    location ^~ /api/ {
        proxy_pass http://service:3002/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # Agent 模式走 SSE（/api/agent-process）：必须关缓冲，
        # 否则 nginx 会把事件攒在缓冲区里，前端看不到流式效果
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # 带 hash 的构建产物可以长缓存
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA 回退：前端是 history 路由，刷新子路径要回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
